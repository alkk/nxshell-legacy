name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B package

      - uses: actions/upload-artifact@v7
        with:
          name: nxshell
          path: target/nxshell-*.jar
          retention-days: 7
