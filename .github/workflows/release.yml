name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check tag matches pom version
        run: test "v$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" = "$GITHUB_REF_NAME"

      - run: mvn -B package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/nxshell-*.jar --title "nxshell ${GITHUB_REF_NAME#v}" --generate-notes
